name: CI

on: [push, pull_request]

# Least privilege: the suites only read the checked-out tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir tests (${{ matrix.elixir }})
    runs-on: ubuntu-latest
    # Run inside the official Elixir image — the tag pins Elixir+OTP and is the *same*
    # image you can run locally, e.g.:
    #   docker run --rm -v "$PWD":/app -w /app elixir:1.18-otp-27 mix test
    container: elixir:${{ matrix.elixir }}
    strategy:
      fail-fast: false
      matrix:
        elixir:
          - "1.18-otp-27" # supported floor — built-in JSON module landed in Elixir 1.18
          - "1.19-otp-28"
          - "1.20-otp-29" # matches local dev; whole-program gradual type checking
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install hex + rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Check formatting
        run: mix format --check-formatted

      - name: Test (with coverage)
        run: mix test --cover

  api:
    name: API tests
    runs-on: ubuntu-latest
    container: elixir:1.18-otp-27
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: postgres
      PGPORT: "5432"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install hex + rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Get deps
        run: mix deps.get

      - name: Audit retired dependencies
        run: mix hex.audit

      - name: Reject unused dependencies
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Test
        run: mix test

  image-smoke:
    name: Release image smoke
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and start the release stack
        run: docker compose -f api/docker-compose.yml up -d --build --wait

      - name: Exercise liveness, readiness, auth, and metadata
        run: |
          curl --fail --silent http://localhost:4000/health
          curl --fail --silent http://localhost:4000/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:4000/v1/metadata)" = 401
          curl --fail --silent \
            -H 'Authorization: Bearer local-product-token-change-me-000001' \
            http://localhost:4000/v1/metadata

      - name: Recover projections before rebinding listeners
        run: |
          curl --fail --silent \
            -X PUT \
            -H 'Authorization: Bearer local-product-token-change-me-000001' \
            -H 'Content-Type: application/json' \
            --data '{"operation":"replace","claims":[{"kind":"identity","codes":["supplier_ref:ci-recovery"]}]}' \
            http://localhost:4000/v1/source-records/ci/recovery/revisions/1
          docker compose -f api/docker-compose.yml exec -T db \
            psql -U postgres -d golden_record_api -v ON_ERROR_STOP=1 \
            -c "UPDATE projection_checkpoints SET \"offset\" = 0 WHERE name = 'main'"
          docker compose -f api/docker-compose.yml restart api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Print container logs
        if: always()
        run: docker compose -f api/docker-compose.yml logs

      - name: Stop release stack
        if: always()
        run: docker compose -f api/docker-compose.yml down -v

  php:
    name: PHP tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.3" # supported floor (php/composer.json: "php": ">=8.3")
          - "8.4"
          - "8.5" # matches local dev (8.5.1, per php/bench/RESULTS.md)
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring # Codes::toStringValue uses mb_chr; JSON/PCRE are built in
          coverage: none

      # composer.lock is committed, so this is deterministic. The parity gate's oracle output
      # (php/bench/golden_422156.expected.json) and the 422156 fixture are committed too, so the
      # PHP suite runs standalone — no Elixir needed in this job.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Test
        run: ./vendor/bin/phpunit --no-coverage
