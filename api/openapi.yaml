# Executable OpenAPI 3.1 contract for Ingot.
openapi: 3.1.0
info:
  title: Ingot Golden Record API
  version: 1.0.0-pilot
  description: |
    Deterministic golden records with source-record lifecycle, two-clock history, and
    evidence-bound human review. Two surfaces use separate credentials:

    * **Product API** (`/v1`) — source revisions and migration dry-runs in; golden records,
      identity status, metadata, independent `known_at` / `effective_at` reads, and events out.
    * **Steward API** (`/steward`) — humans curating the conflicts the engine refuses to guess on:
      the open queue and four recorded decisions. Also a server-rendered HTML queue page.

servers:
  - url: http://localhost:4000
    description: local dev (`cd api && iex -S mix` or the compose stack)

security: []

tags:
  - name: health
  - name: product
    description: Product API — `PRODUCT_API_TOKEN`
  - name: steward
    description: Steward API — individual Bearer or HTTP Basic credentials

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Process liveness only (unauthenticated)
      responses:
        "200":
          description: The API process can answer HTTP requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Database schema and projection readiness (unauthenticated)
      responses:
        "200":
          description: Database is reachable and projections match the event log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Database unavailable, schema missing, or projections lagging
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /v1/backfill/envelopes:
    post:
      tags: [product]
      operationId: backfillEnvelopes
      summary: Backfill contract-C history envelopes (idempotent per envelope)
      description: |
        Envelopes per `docs/HISTORY_ENVELOPE.md`, folded **finer-grained** (one dated identity
        claim per raw identity event). Replaying identical envelope content is a no-op. The whole
        batch validates or rejects — nothing partial enters the log.
      security: [{ productToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelopes]
              properties:
                envelopes:
                  type: array
                  items: { $ref: "#/components/schemas/HistoryEnvelope" }
      responses:
        "200": { $ref: "#/components/responses/WriteSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationErrors" }

  /v1/claims:
    post:
      tags: [product]
      operationId: pushClaims
      summary: Push live engine-native claims
      description: |
        `recorded_at` is server-side today; optional `valid_from` backdates validity. Codes are
        `"scheme:value"` strings (`cnk`, `gtin`/`ean`/`upc`, `cip_acl7`, `mpn`, …; unknown
        schemes pass through). Reconciliation is fold-forward against the live ledger — surrogate
        keys stay stable.
      security: [{ productToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claims]
              properties:
                claims:
                  type: array
                  items: { $ref: "#/components/schemas/Claim" }
      responses:
        "200": { $ref: "#/components/responses/WriteSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationErrors" }

  /v1/dry-run:
    post:
      tags: [product]
      operationId: dryRunClaims
      summary: Validate and simulate a claims batch without committing
      security: [{ productToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contract/claims.schema.json" }
      responses:
        "200":
          description: deterministic migration report; `would_commit` says whether submission is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DryRunReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/cutover:
    post:
      tags: [product]
      operationId: cutoverClaims
      summary: Commit a validated migration batch with convergent rerun semantics
      security: [{ productToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contract/claims.schema.json" }
      responses:
        "200":
          description: committed migration report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DryRunReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationErrors" }

  /v1/source-records/{source}/{ref}/revisions/{revision}:
    put:
      tags: [product]
      operationId: putSourceRecordRevision
      summary: Replace, patch, withdraw, or reactivate one atomic source record
      security: [{ productToken: [] }]
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contract/source_record.schema.json" }
      responses:
        "200":
          description: accepted revision, stable key, and lineage events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationErrors" }

  /v1/source-records/{source}/{ref}:
    get:
      tags: [product]
      operationId: getSourceRecord
      summary: Read one source record under independent knowledge and effective clocks
      security: [{ productToken: [] }]
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: ref, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/KnownAt" }
        - { $ref: "#/components/parameters/EffectiveAt" }
      responses:
        "200":
          description: selected source revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/identities/{key}:
    get:
      tags: [product]
      operationId: getIdentityStatus
      summary: Inspect current identity status, redirects, codes, lane, and legacy ids
      security: [{ productToken: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: current identity status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/metadata:
    get:
      tags: [product]
      operationId: getMetadata
      summary: Scheme/relation registry, survivorship policy, review policy, and clock formats
      security: [{ productToken: [] }]
      responses:
        "200":
          description: active runtime metadata
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/products/{legacy_id}:
    get:
      tags: [product]
      operationId: getProductByLegacyId
      summary: The product a legacy medipim ID answers to
      description: |
        The backwards-compatible primary read. A legacy ID assigned to a key that was later
        merged away **keeps answering** — followed to the survivor, with `merged_from` set.
        With `as_of`, the product as **known on** that date (log fold; honest 404 with the date
        echoed when it wasn't resolvable yet).
      security: [{ productToken: [] }]
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema: { type: integer }
        - name: as_of
          in: query
          required: false
          schema: { type: string, format: date }
          deprecated: true
          description: compatibility alias that sets both clocks to one date
        - { $ref: "#/components/parameters/KnownAt" }
        - { $ref: "#/components/parameters/EffectiveAt" }
      responses:
        "200":
          description: the resolved product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: malformed `as_of`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/products/by-code/{scheme}/{code}:
    get:
      tags: [product]
      operationId: getProductByCode
      summary: Which product(s) own a code
      description: |
        Any spelling works — codes canonicalize (an EAN-13 finds the stored GTIN-14). A
        legitimately shared code returns every carrier.
      security: [{ productToken: [] }]
      parameters:
        - name: scheme
          in: path
          required: true
          schema: { type: string }
          example: cnk
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: "1234567"
        - { $ref: "#/components/parameters/KnownAt" }
        - { $ref: "#/components/parameters/EffectiveAt" }
      responses:
        "200":
          description: canonical code + its carrier products
          content:
            application/json:
              schema:
                type: object
                required: [code, products]
                properties:
                  code: { type: string, example: "cnk:1234567" }
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/changes:
    get:
      tags: [product]
      operationId: getChanges
      summary: The change feed (poll with the returned cursor)
      security: [{ productToken: [] }]
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: return events with offset strictly greater than this
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: events after the cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: bad cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /steward/v1/queue:
    get:
      tags: [steward]
      operationId: getStewardQueue
      summary: Open conflicts — gated merge proposals + attribute ties
      security: [{ stewardToken: [] }, { stewardBasic: [] }]
      responses:
        "200":
          description: the open queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /steward/v1/decisions:
    post:
      tags: [steward]
      operationId: postStewardDecision
      summary: Record a steward decision
      description: |
        The individual Bearer credential determines the actor. The body must identify the open
        review case and captured evidence offset. Merge, split, and suppress require endorsements
        from two distinct principals.
      security: [{ stewardToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contract/steward_decision.schema.json" }
      responses:
        "200":
          description: applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: string, example: approve_merge }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: stale — the state moved on; the body lists what is live now
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  live_keys: { type: array, items: { type: string } }
        "422": { $ref: "#/components/responses/BadRequest" }

  /steward:
    get:
      tags: [steward]
      operationId: getStewardPage
      summary: The HTML queue page (browser; individual HTTP Basic credential)
      security: [{ stewardBasic: [] }, { stewardToken: [] }]
      responses:
        "200":
          description: server-rendered queue with decision forms
          content:
            text/html: {}
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  parameters:
    KnownAt:
      name: known_at
      in: query
      required: false
      description: knowledge cutoff; what Ingot had recorded by this instant
      schema: { type: string, format: date-time }
    EffectiveAt:
      name: effective_at
      in: query
      required: false
      description: real-world date for which facts must be valid
      schema: { type: string, format: date }

  securitySchemes:
    productToken:
      type: http
      scheme: bearer
      description: "`PRODUCT_API_TOKEN` — cannot reach steward decisions"
    stewardToken:
      type: http
      scheme: bearer
      description: individual token from `STEWARD_CREDENTIALS_JSON`; determines the principal
    stewardBasic:
      type: http
      scheme: basic
      description: individual principal/password from `STEWARD_CREDENTIALS_JSON` (browser path)

  responses:
    Unauthorized:
      description: missing or wrong token for this surface
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: malformed or semantically invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: authenticated credential cannot perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: revision or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationErrors:
      description: the WHOLE batch rejects — nothing partial enters the log
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    index: { type: [integer, "null"] }
                    error: { type: string }
    WriteSummary:
      description: what identity DID — minted/changed keys and any gated proposals
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WriteSummary" }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { const: ok }

    Readiness:
      type: object
      required: [status, db]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        db: { type: boolean }
        event_offset: { type: integer, minimum: 0 }
        projection_offset: { type: integer, minimum: 0 }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    CodeString:
      type: string
      description: "`scheme:value` — engine scheme vocabulary; unknown schemes pass through"
      example: "cnk:1234567"

    Claim:
      oneOf:
        - $ref: "#/components/schemas/IdentityClaim"
        - $ref: "#/components/schemas/AttributeClaim"
        - $ref: "#/components/schemas/MediaClaim"
        - $ref: "#/components/schemas/GroupingClaim"
        - $ref: "#/components/schemas/EdgeClaim"
      discriminator:
        propertyName: kind

    IdentityClaim:
      type: object
      required: [kind, source, ref, codes]
      properties:
        kind: { const: identity }
        source: { type: string, example: medipim }
        ref: { type: string, description: the source's own listing reference }
        codes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CodeString" }
        entity:
          type: string
          enum: [product, substance, description, media]
          description: >-
            entity lane — usually derived from the codes' schemes (mixing lanes rejects);
            required only when every code is the lane-neutral, engine-minted `uuid` scheme
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }

    EdgeClaim:
      type: object
      description: >-
        a typed relationship between two coded records; both endpoints resolve to their current
        owner key at read time, so the edge survives merge/split on either side. The relation's
        lane signature (contains product→substance, describes description→product|substance,
        depicts media→product|substance) is enforced — a mismatched endpoint rejects.
      required: [kind, source, from, relation, to]
      properties:
        kind: { const: edge }
        source: { type: string }
        from: { $ref: "#/components/schemas/CodeString" }
        relation: { type: string, example: describes }
        to: { $ref: "#/components/schemas/CodeString" }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }

    AttributeClaim:
      type: object
      required: [kind, source, code, field, value]
      properties:
        kind: { const: attribute }
        source: { type: string }
        code: { $ref: "#/components/schemas/CodeString" }
        field: { type: string, example: name }
        value:
          oneOf: [{ type: string }, { type: number }, { type: boolean }]
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }

    MediaClaim:
      type: object
      required: [kind, source, asset, target, uri]
      properties:
        kind: { const: media }
        source: { type: string }
        asset: { type: string, example: IMG-1 }
        target: { $ref: "#/components/schemas/CodeString" }
        role: { type: string, enum: [primary, secondary], default: secondary }
        uri: { type: string }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }

    GroupingClaim:
      type: object
      required: [kind, source, code, product]
      properties:
        kind: { const: grouping }
        source: { type: string }
        code: { $ref: "#/components/schemas/CodeString" }
        product: { type: integer, description: the legacy entity this code belongs to }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }

    HistoryEnvelope:
      type: object
      description: contract C — see `docs/HISTORY_ENVELOPE.md` for the full event grammar
      required: [schema_version, legacy_entity, events]
      properties:
        schema_version: { type: string, const: "1" }
        legacy_entity: { type: integer, example: 422156 }
        events:
          type: array
          items: { type: object }

    WriteSummary:
      type: object
      properties:
        accepted: { type: integer }
        skipped: { type: integer, description: envelopes already seen (idempotent replay) }
        claims: { type: integer }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [minted, members_changed, merged, split, merge_proposal, flag] }
              key: { type: string }
              date: { type: string, format: date }
        flagged:
          type: array
          description: convergences the over-merge guard GATED for a steward
          items:
            type: object
            properties:
              type: { const: merge_proposal }
              keys: { type: array, items: { type: string } }

    DryRunReport:
      type: object
      required: [would_commit, counts, validation]
      properties:
        would_commit: { type: boolean }
        counts: { type: object }
        validation: { type: object }
        submission: { type: object }
        merge_candidates: { type: array, items: { type: object } }
        conflicts: { type: array, items: { type: object } }
        collisions: { type: array, items: { type: object } }
        steward_queue: { $ref: "#/components/schemas/Queue" }
        lineage: { type: array, items: { type: object } }

    SourceRecord:
      type: object
      required: [source, ref, revision, operation, status, recorded_at, valid_from]
      properties:
        source: { type: string }
        ref: { type: string }
        revision: { type: string }
        operation: { enum: [replace, patch, withdraw, reactivate] }
        status: { enum: [active, withdrawn] }
        key: { type: [string, "null"] }
        legacy_id: { type: [integer, "null"] }
        recorded_at: { type: string, format: date-time }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }
        known_at: { type: string, format: date-time }
        effective_at: { type: string, format: date }
        claims:
          type: array
          items:
            type: object
            description: materialized claim without route-derived source/ref fields

    IdentityStatus:
      type: object
      required: [key, current_key, status, lane, codes, legacy_ids]
      properties:
        key: { type: string }
        current_key: { type: string }
        status: { enum: [active, merged, withdrawn] }
        lane: { enum: [product, substance, description, media] }
        codes:
          type: array
          items: { $ref: "#/components/schemas/CodeString" }
        legacy_ids:
          type: array
          items: { type: integer }

    Attribute:
      type: object
      properties:
        field: { type: string }
        value:
          oneOf: [{ type: string }, { type: number }, { type: boolean }]
        winner: { type: [string, "null"], description: "the winning source, or `steward:<name>`" }
        status: { type: string, enum: [resolved, needs_review, resolved_by_steward] }
        candidates:
          type: array
          description: the full ranking, best first — provenance
          items:
            type: object
            properties:
              source: { type: string }
              value:
                oneOf: [{ type: string }, { type: number }, { type: boolean }]

    Product:
      type: object
      properties:
        legacy_id: { type: integer, example: 422156 }
        key: { type: string, example: SK_1 }
        status: { type: string, enum: [active, merged, withdrawn, unknown] }
        merged_from:
          type: [string, "null"]
          description: set when this legacy ID belonged to a key merged into the answering one
        codes:
          type: array
          items: { $ref: "#/components/schemas/CodeString" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/Attribute" }
        media:
          type: array
          items:
            type: object
            properties:
              asset: { type: string, example: "dam:IMG-1" }
              source: { type: string }
              uri: { type: string }
        as_of:
          type: string
          format: date
          description: present on time-travel reads
        known_at: { type: string, format: date-time }
        effective_at: { type: string, format: date }

    ChangesPage:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/FeedEvent" }
        next: { type: integer, description: cursor for the following call }
        count: { type: integer }

    FeedEvent:
      type: object
      required: [offset, type, date]
      properties:
        offset: { type: integer }
        type:
          type: string
          enum: [claim, source_record_replace, source_record_patch, source_record_withdraw, source_record_reactivate, source_record_key_bound, review_case_opened, review_case_endorsed, minted, members_changed, merged, split, legacy_id_assigned, merge_proposal, flag, decision]
        date: { type: string, format: date }
        key: { type: string }
        keys: { type: array, items: { type: string } }
        codes: { type: array, items: { $ref: "#/components/schemas/CodeString" } }
        from: { type: array, items: { type: string } }
        into: {}
        legacy_id: { type: integer }
        kind: { type: string }
        source: { type: string }
        subject: { type: string }
        decision: { type: string }
        by: { type: string }

    Queue:
      type: object
      properties:
        open: { type: integer, description: open conflicts (merges + attribute ties) }
        merges:
          type: array
          items:
            type: object
            properties:
              type: { const: merge }
              case_id: { type: string }
              evidence_offset: { type: integer }
              keys: { type: array, items: { type: string } }
              members:
                type: object
                description: each key's current member codes, with the sources claiming each
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { $ref: "#/components/schemas/CodeString" }
                      sources:
                        type: array
                        items: { type: string }
              bridge_sources:
                type: array
                description: the sources whose listings caused the proposal
                items: { type: string }
              bridges:
                type: array
                description: the CONNECTING CLAIMS — listings whose codes span the keys
                items:
                  type: object
                  properties:
                    source: { type: string }
                    ref: { type: string }
                    date: { type: string, format: date }
                    codes:
                      type: array
                      items:
                        type: object
                        properties:
                          code: { $ref: "#/components/schemas/CodeString" }
                          owner:
                            type: [string, "null"]
                            description: the key this code belongs to (null = not yet on any key)
              shared:
                type: array
                description: codes directly present on more than one of the keys (rare)
                items: { $ref: "#/components/schemas/CodeString" }
        repairs:
          type: array
          description: recently merged survivors — split candidates ("select what doesn't belong")
          items:
            type: object
            properties:
              case_id: { type: string }
              evidence_offset: { type: integer }
              key: { type: string }
              merged_from: { type: array, items: { type: string } }
              codes:
                type: array
                items:
                  type: object
                  properties:
                    code: { $ref: "#/components/schemas/CodeString" }
                    sources:
                      type: array
                      description: the sources currently claiming this code
                      items: { type: string }
        attributes:
          type: array
          items:
            type: object
            properties:
              type: { const: attribute }
              case_id: { type: string }
              evidence_offset: { type: integer }
              key: { type: string }
              field: { type: string }
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string }
                    value:
                      oneOf: [{ type: string }, { type: number }, { type: boolean }]

    Decision:
      $ref: "../contract/steward_decision.schema.json"
